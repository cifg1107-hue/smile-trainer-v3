<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>笑顔トレーナー</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 14px 40px;
      font-family: -apple-system, BlinkMacSystemFont,
        "Hiragino Sans", "Yu Gothic", sans-serif;
      background: #fffaf2;
      color: #222;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    h1 {
            margin: 0 0 6px;
      font-size: 32px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    #startButton {
      width: 100%;
      max-width: 340px;
      padding: 16px 20px;
      border: 0;
      border-radius: 16px;
      background: #222;
      color: #fff;
      font-size: 20px;
      font-weight: 800;
    }

    #startButton:disabled {
      opacity: 0.65;
    }

    .camera-box {
      margin: 18px auto 0;
      background: #111;
      border-radius: 22px;
          overflow: hidden;
      aspect-ratio: 3 / 4;
      max-height: 620px;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scaleX(-1);
    }

    .score-card {
      margin-top: 18px;
      background: #fff;
      border-radius: 22px;
      padding: 22px 18px;
      box-shadow: 0 4px 22px rgba(0,0,0,0.08);
    }

    #score {
      font-size: 68px;
      font-weight: 900;
      line-height: 1.05;
      margin: 8px 0 4px;
    }

    #rank {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .meter {
      margin: 14px 0 16px;
      text-align: left;
    }

    .meter-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    #advice {
      margin-top: 20px;
      padding: 14px;
      background: #f4f4f4;
      border-radius: 14px;
      line-height: 1.65;
      font-weight: 700;
    }

    #status {
      margin-top: 12px;
      font-size: 13px;
      color: #777;
      min-height: 20px;
      white-space: pre-wrap;
    }

    .bar-bg {
      height: 12px;
      background: #eee;
      border-radius: 99px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      width: 0;
      background: #222;
      border-radius: 99px;
    }

    .note {
      margin-top: 18px;
      font-size: 12px;
      color: #888;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<div class="container">

  <h1> 笑顔トレーナー</h1>

  <div class="subtitle">
    接客で伝わる笑顔を練習しよう
  </div>

  <button id="startButton">
    カメラを起動
  </button>

  <div class="camera-box">
    <video
      id="video"
      autoplay
      playsinline
      muted>
    </video>
  </div>

  <div class="score-card">

    <div>笑顔レベル</div>

    <div id="score">--</div>

    <div id="rank">
      カメラを起動してください
    </div>
        <div class="meter">
      <div class="meter-row">
        <span> 口角</span>
        <span id="mouthValue">--</span>
      </div>
      <div class="bar-bg">
        <div id="mouthBar" class="bar"></div>
      </div>
    </div>

    <div class="meter">
      <div class="meter-row">
        <span> 目元</span>
        <span id="eyeValue">--</span>
      </div>
      <div class="bar-bg">
        <div id="eyeBar" class="bar"></div>
      </div>
    </div>

    <div class="meter">
      <div class="meter-row">
        <span> 左右バランス</span>
        <span id="balanceValue">--</span>
      </div>
      <div class="bar-bg">
        <div id="balanceBar" class="bar"></div>
      </div>
    </div>

    <div id="advice">
      笑顔になると、
      ここにアドバイスが表示されます。
    </div>

    <div id="status">
      準備前
    </div>

  </div>

  <div class="note">
    ※接客練習用の独自スコアです。<br>
    ※医学的・心理学的な評価ではありません。<br>
    ※カメラ映像は保存しません。
  </div>

</div>

<script type="module">
    const video =
  document.getElementById("video");

const startButton =
  document.getElementById("startButton");

const scoreEl =
  document.getElementById("score");

const rankEl =
  document.getElementById("rank");

const statusEl =
  document.getElementById("status");

const adviceEl =
  document.getElementById("advice");

const mouthValue =
  document.getElementById("mouthValue");

const eyeValue =
  document.getElementById("eyeValue");

const balanceValue =
  document.getElementById("balanceValue");

const mouthBar =
  document.getElementById("mouthBar");

const eyeBar =
  document.getElementById("eyeBar");

const balanceBar =
  document.getElementById("balanceBar");


let faceLandmarker = null;

let running = false;

let lastVideoTime = -1;

let perfectStart = null;


function clamp(value, min, max) {

  return Math.min(
    Math.max(value, min),
    max
  );

}


function getBlendshape(
  categories,
  name
) {
    const item =
    categories.find(
      category =>
        category.categoryName === name
    );

  return item ? item.score : 0;

}


function scale(
  raw,
  low,
  high
) {

  if (raw <= low) {
    return 0;
  }

  if (raw >= high) {
    return 100;
  }

  const x =
    (raw - low) /
    (high - low);

  return Math.round(
    100 * Math.pow(x, 1.6)
  );

}


async function prepareAI() {

  statusEl.textContent =
    "笑顔判定を準備しています…";

  const vision =
    await import(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm"
    );

  const files =
    await vision.FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );

  faceLandmarker =
    await vision.FaceLandmarker.createFromOptions(
      files,
      {
           baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
        },

        runningMode: "VIDEO",

        numFaces: 1,

        outputFaceBlendshapes: true
      }
    );

  statusEl.textContent =
    "準備OK。笑ってみてください！";

}


function updateResult(categories) {

  const smileLeft =
    getBlendshape(
      categories,
      "mouthSmileLeft"
    );

  const smileRight =
    getBlendshape(
      categories,
      "mouthSmileRight"
    );

  const eyeLeft =
    getBlendshape(
      categories,
      "eyeSquintLeft"
    );

  const eyeRight =
    getBlendshape(
      categories,
      "eyeSquintRight"
    );


  const mouthRaw =
    (smileLeft + smileRight) / 2;

  const eyeRaw =
    (eyeLeft + eyeRight) / 2; 
   const mouthScore =
    scale(
      mouthRaw,
      0.18,
      0.92
    );

  const eyeScore =
    scale(
      eyeRaw,
      0.10,
      0.82
    );


  const difference =
    Math.abs(
      smileLeft - smileRight
    );

  const balanceScore =
    clamp(
      Math.round(
        100 - difference * 230
      ),
      0,
      100
    );


const strictMouth =
  mouthScore <= 55
    ? 0
    : 100 * Math.pow(
        (mouthScore - 55) / 45,
        2.2
      );

const strictEye =
  eyeScore <= 45
    ? 0
    : 100 * Math.pow(
        (eyeScore - 45) / 55,
        2.2
      );

let total =
  strictMouth * 0.65 +
  strictEye * 0.35;

if (balanceScore < 85) {
  total *= 0.90;
}

if (balanceScore < 70) {
  total *= 0.82;
}

total =
  clamp(
    Math.round(total),
    0,
    99
  );

const perfect =
  mouthScore === 100 &&
  eyeScore === 100 &&
  balanceScore >= 98;

if (perfect) {

  if (perfectStart === null) {
    perfectStart = performance.now();
  }

  if (
    performance.now() -
    perfectStart >= 2500
  ) {
    total = 100;
  }

} else {

  perfectStart = null;

}  

  scoreEl.textContent =
    total + "点";
    
  mouthValue.textContent =
    mouthScore;

  eyeValue.textContent =
    eyeScore;

  balanceValue.textContent =
    balanceScore;


  mouthBar.style.width =
    mouthScore + "%";

  eyeBar.style.width =
    eyeScore + "%";

  balanceBar.style.width =
    balanceScore + "%";


  if (total === 100) {

    rankEl.textContent =
      "★★★★★ 100点！お手本レベル";

  } else if (total >= 90) {

    rankEl.textContent =
      "★★★ 相当良い接客笑顔";

  } else if (total >= 80) {

    rankEl.textContent =
      "★★ かなり良い笑顔";

  } else if (total >= 65) {

    rankEl.textContent =
      "★ 接客として良い笑顔";

  } else if (total >= 40) {

    rankEl.textContent =
      "もう一段、笑顔を大きく";

  } else if (total >= 15) {

    rankEl.textContent =
      "軽い笑顔";

  } else {

    rankEl.textContent =
      "笑顔を意識してみよう";

  } 
  if (mouthScore < 35) {

    adviceEl.textContent =
      "💡 もう少し口角を上げてみましょう。";

  } else if (eyeScore < 35) {

    adviceEl.textContent =
      "💡 口元はOK。目元まで笑うと点数が上がります。";

  } else if (balanceScore < 75) {

    adviceEl.textContent =
      "💡 左右の口角を同じくらい上げてみましょう。";

  } else {

    adviceEl.textContent =
      "✨ 良い笑顔です。さらに1段階大きな笑顔を！";

  }

}


function predict() {

  if (
    !running ||
    !faceLandmarker
  ) {
    return;
  }


  if (
    video.readyState >= 2 &&
    video.currentTime !== lastVideoTime
  ) {

    lastVideoTime =
      video.currentTime;

    const result =
      faceLandmarker.detectForVideo(
        video,
        performance.now()
      );
    if (
      result.faceBlendshapes &&
      result.faceBlendshapes.length > 0
    ) {

      updateResult(
        result.faceBlendshapes[0].categories
      );

      statusEl.textContent =
        "顔を認識しています";

    } else {

      scoreEl.textContent =
        "--";

      rankEl.textContent =
        "顔をカメラ中央に映してください";

      statusEl.textContent =
        "顔を探しています…";

      perfectStart = null;

    }

  }


  requestAnimationFrame(
    predict
  );

}


startButton.addEventListener(
  "click",
  async () => {

    try {

      startButton.disabled =
        true;

      startButton.textContent =
        "準備しています…";

      statusEl.textContent =
        "準備しています…";

　　　　if (!faceLandmarker) {

  await prepareAI();

}
       statusEl.textContent =
        "カメラ許可を確認してください";


      const stream =
        await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user"
          },
          audio: false
        });


      video.srcObject =
        stream;

      await video.play();


      running =
        true;

      startButton.textContent =
        "カメラ起動中";

      statusEl.textContent =
        "笑ってみてください ！";


      requestAnimationFrame(
        predict
      );


    } catch (error) {

      console.error(error);

      startButton.disabled =
        false;

      startButton.textContent =
        "もう一度カメラを起動";

      statusEl.textContent =
        "エラー：" +
        (error.message || error);

    }

  }
);

</script>

</body>
</html>
